
services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: olist-kafka
    ports:
      # Securely bind to localhost only to prevent external port scanning
      - "127.0.0.1:9092:29092"
    environment:
      # --- KRaft Mode Single-Node Cluster Configurations ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      
      # --- Multi-Listener Network Routing Protocol ---
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      
      # --- Disk Storage and Format Initialization ---
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      # Static pre-generated Cluster ID for KRaft automatic formatting
      CLUSTER_ID: '4L62xd2TSh98fUfG8S6A1g'
    volumes:
      - kafka_data:/var/lib/kafka/data
    # --- Strict Resource Budget Allocations (4GB VM Limit) ---
    mem_limit: 1280m
    cpus: '1.0'
    healthcheck:
      # Handshake verification using Kafka's built-in tool, avoiding shallow TCP port checks
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: olist-schema-registry
    ports:
      # Securely bind to localhost only
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      # Directs Schema Registry to connect to Kafka via the internal container-to-container network
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka:9092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'
    depends_on:
      kafka:
        condition: service_healthy # Block container initialization until the broker passes its active api-handshake
    # --- Strict Resource Budget Allocations (4GB VM Limit) ---
    mem_limit: 512m
    cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  kafka_data:
    driver: local